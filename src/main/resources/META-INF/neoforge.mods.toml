modLoader="javafml" 
loaderVersion="${loader_version_range}" 
license="${mod_license}"
#issueTrackerURL="https://github.com/NadienDev/CreateUncraftableRecipes/issues"


[[mods]] 
modId="${mod_id}" 
version="${mod_version}" 
displayName="${mod_name}"
displayURL="https://github.com/SrNadien"
logoFile="logo.png" 
credits="${mod_author}" 
authors="${mod_author}"
description='''
Adds mechanical crafting recipes for Create's creative items.
This mod allows you to craft creative-only items in survival mode using expensive recipes.
'''


#[[mixins]]
#config="${mod_id}.mixins.json"
#file="META-INF/accesstransformer.cfg"

# Dependencies

# NeoForge dependency
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# Minecraft dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create mod dependency (REQUIRED)
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"

# JEI dependency (OPTIONAL - for recipe viewing)
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="${jei_version}"
    ordering="AFTER"
    side="CLIENT"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"